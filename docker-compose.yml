services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sap_access
      POSTGRES_USER: sap_access
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap_access -d sap_access"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
